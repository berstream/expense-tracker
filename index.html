<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>รายรับ-รายจ่าย</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --primary:#0f766e; --primary-light:#14b8a6; --bg:#f8fafc; --card:#ffffff;
    --text:#0f172a; --text-dim:#64748b; --border:#e2e8f0;
    --income:#16a34a; --expense:#dc2626; --radius:14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Noto Sans Thai','Noto Sans',sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom: calc(72px + var(--safe-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  .hidden{display:none !important;}
  .app-header{
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    color:#fff; padding:20px 16px 28px; border-radius:0 0 20px 20px;
  }
  .app-header h1{font-size:15px; font-weight:500; opacity:.85;}
  .month-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:4px;}
  .month-nav button{background:rgba(255,255,255,.2); border:none; color:#fff; width:32px; height:32px; border-radius:50%; font-size:16px;}
  .month-nav .month-label{font-size:18px; font-weight:600;}
  .balance{text-align:center; margin-top:14px;}
  .balance .amount{font-size:32px; font-weight:700;}
  .balance .label{font-size:12px; opacity:.8;}
  .io-row{display:flex; justify-content:center; gap:28px; margin-top:10px; font-size:13px;}
  .io-row .io-item{display:flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%;}
  .dot.income{background:#4ade80;} .dot.expense{background:#fca5a5;}

  main{padding:14px; max-width:560px; margin:0 auto;}
  @font-face{font-family:'TH Sarabun New'; src:url('fonts/THSarabunNew.woff') format('woff'); font-weight:400; font-display:swap;}
  @font-face{font-family:'TH Sarabun New'; src:url('fonts/THSarabunNew-Bold.woff') format('woff'); font-weight:700; font-display:swap;}
  .card{background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); border:1px solid var(--border);}
  .card h2{font-size:14px; font-weight:600; margin-bottom:10px; color:var(--text-dim);}

  .skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:8px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  .tx-item{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .tx-item:last-child{border-bottom:none;}
  .tx-icon{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .tx-main{flex:1; min-width:0;}
  .tx-cat{font-weight:500; font-size:14px;}
  .tx-note{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx-amount{font-weight:600; font-size:14px; flex-shrink:0;}
  .tx-amount.income{color:var(--income);} .tx-amount.expense{color:var(--expense);}
  .tx-date-group{font-size:12px; color:var(--text-dim); font-weight:600; margin:14px 0 4px; text-transform:uppercase;}
  .tx-date-group:first-child{margin-top:0;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--text-dim);}
  .empty-state .emoji{font-size:40px; margin-bottom:10px;}

  .chart-wrap{position:relative; height:220px;}
  .cat-legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .cat-legend-item{display:flex; align-items:center; gap:5px; font-size:12px; background:#f1f5f9; padding:4px 10px; border-radius:20px;}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    display:flex; padding-bottom: var(--safe-bottom); z-index:40;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:10px 0 6px; display:flex; flex-direction:column;
    align-items:center; gap:2px; font-size:10px; color:var(--text-dim); font-family:inherit;
  }
  nav.tabbar button .icon{font-size:20px;}
  nav.tabbar button.active{color:var(--primary);}

  .fab{
    position:fixed; right:18px; bottom:calc(84px + var(--safe-bottom)); width:56px; height:56px; border-radius:50%;
    background:var(--primary); color:#fff; border:none; font-size:26px; box-shadow:0 4px 12px rgba(15,118,110,.4); z-index:41;
  }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end;
  }
  .sheet{
    background:#fff; width:100%; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0;
    padding:18px 16px calc(24px + var(--safe-bottom));
  }
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 14px;}
  .sheet h3{font-size:17px; margin-bottom:16px;}

  .type-toggle{display:flex; background:#f1f5f9; border-radius:10px; padding:3px; margin-bottom:16px;}
  .type-toggle button{flex:1; padding:9px; border:none; background:none; border-radius:8px; font-family:inherit; font-size:14px; font-weight:600; color:var(--text-dim);}
  .type-toggle button.active{background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .type-toggle button.active.income{color:var(--income);} .type-toggle button.active.expense{color:var(--expense);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px;
    font-family:inherit; background:#fff; color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--primary);}
  .amount-input{font-size:28px !important; font-weight:700; text-align:center; padding:14px !important;}

  .cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .cat-chip{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:12px;
    border:2px solid var(--border); background:#fff; font-family:inherit;
  }
  .cat-chip.selected{border-color:var(--primary); background:#f0fdfa;}
  .cat-chip .emoji{font-size:20px;}
  .cat-chip .name{font-size:10px; color:var(--text-dim); text-align:center; line-height:1.2;}

  .btn{width:100%; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:600; font-family:inherit;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-outline{background:#fff; border:1px solid var(--border); color:var(--text);}
  .btn-danger{background:#fef2f2; color:var(--expense);}
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn-row .btn{flex:1;}

  .receipt-upload-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border:2px dashed var(--border);
    border-radius:12px; color:var(--text-dim); font-size:13px; margin-bottom:14px; background:#fafafa;
  }
  .receipt-preview{width:100%; border-radius:10px; margin-bottom:12px; max-height:180px; object-fit:cover;}
  .ocr-badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; background:#f0fdfa; color:var(--primary); padding:3px 8px; border-radius:20px; margin-bottom:10px;}

  .settings-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .label{font-size:14px;}
  .settings-row select{border:none; background:none; font-family:inherit; font-size:14px; color:var(--primary); font-weight:600;}

  .cat-manage-item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .cat-manage-item .emoji{font-size:20px; width:30px; text-align:center;}
  .cat-manage-item .name{flex:1; font-size:14px;}
  .cat-manage-item button{background:none; border:none; color:var(--text-dim); font-size:16px; padding:4px 8px;}

  .toast{
    position:fixed; bottom:calc(90px + var(--safe-bottom)); left:16px; right:16px;
    background:#1e293b; color:#fff; padding:10px 16px; border-radius:16px; font-size:12px; z-index:100;
    animation:toastIn .2s ease; text-align:center; word-break:break-word;
  }
  @keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(10px);} to{opacity:1; transform:translateX(-50%) translateY(0);}}

  .spinner{width:18px; height:18px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header class="app-header">
  <h1 id="greeting">รายรับ-รายจ่าย</h1>
  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button id="nextMonth">›</button>
  </div>
  <div class="balance">
    <div class="amount" id="balanceAmount">฿0.00</div>
    <div class="label">คงเหลือเดือนนี้</div>
  </div>
  <div class="io-row">
    <div class="io-item"><span class="dot income"></span><span id="totalIncome">฿0</span></div>
    <div class="io-item"><span class="dot expense"></span><span id="totalExpense">฿0</span></div>
  </div>
</header>

<main>

  <!-- TAB: Dashboard -->
  <section id="tab-dashboard">
    <div class="card">
      <h2>สรุปตามหมวดหมู่</h2>
      <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
      <div class="cat-legend" id="catLegend"></div>
    </div>
    <div class="card">
      <h2>รายการล่าสุด</h2>
      <div id="recentList"></div>
    </div>
  </section>

  <!-- TAB: Transactions -->
  <section id="tab-transactions" class="hidden">
    <div class="card">
      <h2>รายการทั้งหมด</h2>
      <div id="txList"></div>
    </div>
  </section>

  <!-- TAB: Categories -->
  <section id="tab-categories" class="hidden">
    <div class="card">
      <h2>รายรับ</h2>
      <div id="catListIncome"></div>
      <button class="btn btn-outline" style="margin-top:10px" onclick="openCategorySheet('income')">+ เพิ่มหมวดรายรับ</button>
    </div>
    <div class="card">
      <h2>รายจ่าย</h2>
      <div id="catListExpense"></div>
      <button class="btn btn-outline" style="margin-top:10px" onclick="openCategorySheet('expense')">+ เพิ่มหมวดรายจ่าย</button>
    </div>
  </section>

  <!-- TAB: Settings -->
  <section id="tab-settings" class="hidden">
    <div class="card">
      <h2>ตั้งค่า</h2>
      <div class="settings-row">
        <div class="label">สกุลเงิน</div>
        <select id="currencySelect">
          <option value="THB">บาท (THB)</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div class="settings-row">
        <div class="label">วันเริ่มต้นเดือน</div>
        <select id="startOfMonthSelect">
          <option value="1">วันที่ 1</option>
          <option value="25">วันที่ 25</option>
        </select>
      </div>
    </div>
    <div class="card">
      <h2>Export ข้อมูล</h2>
      <div class="btn-row" style="margin-top:0; margin-bottom:10px;">
        <div class="field" style="flex:1; margin-bottom:0;"><label>ตั้งแต่วันที่</label><input type="date" id="exportFrom"></div>
        <div class="field" style="flex:1; margin-bottom:0;"><label>ถึงวันที่</label><input type="date" id="exportTo"></div>
      </div>
      <div id="exportInfo" style="font-size:12px; color:var(--text-dim); margin-bottom:10px;"></div>
      <button class="btn btn-primary" id="btnExportXlsx" onclick="exportXLSX()">⬇ Excel (.xlsx) พร้อมรูปสลิป</button>
      <button class="btn btn-outline" id="btnExportPdf" style="margin-top:8px" onclick="exportPDF()">⬇ PDF พร้อมรูปสลิป</button>
      <button class="btn btn-outline" id="btnExportCsv" style="margin-top:8px" onclick="exportCSV()">⬇ CSV (ไม่มีรูป ทุกรายการ)</button>
    </div>
  </section>

</main>

<button class="fab" onclick="openTxSheet()">+</button>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="dashboard"><span class="icon">🏠</span>หน้าหลัก</button>
  <button class="tab-btn" data-tab="transactions"><span class="icon">📋</span>รายการ</button>
  <button class="tab-btn" data-tab="categories"><span class="icon">🏷️</span>หมวดหมู่</button>
  <button class="tab-btn" data-tab="settings"><span class="icon">⚙️</span>ตั้งค่า</button>
</nav>

<!-- ===== Add/Edit Transaction Sheet ===== -->
<div class="sheet-overlay hidden" id="txSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="txSheetTitle">เพิ่มรายการ</h3>

    <label class="receipt-upload-btn" for="receiptInput" id="receiptUploadLabel">
      <span id="receiptUploadText">📷 อัปโหลดสลิป (ให้ AI อ่านให้)</span>
    </label>
    <input type="file" id="receiptInput" accept="image/*" class="hidden">
    <img id="receiptPreview" class="receipt-preview hidden">
    <div id="ocrBadge" class="ocr-badge hidden">✓ อ่านจากสลิป — ตรวจสอบก่อนบันทึก</div>

    <div class="type-toggle">
      <button type="button" id="typeExpenseBtn" class="active expense" onclick="setTxType('expense')">รายจ่าย</button>
      <button type="button" id="typeIncomeBtn" class="income" onclick="setTxType('income')">รายรับ</button>
    </div>

    <div class="field">
      <label>จำนวนเงิน</label>
      <input type="number" inputmode="decimal" id="txAmount" class="amount-input" placeholder="0.00" step="0.01">
    </div>

    <div class="field">
      <label>หมวดหมู่</label>
      <div class="cat-grid" id="txCatGrid"></div>
    </div>

    <div class="field">
      <label>วันที่</label>
      <input type="date" id="txDate">
    </div>

    <div class="field">
      <label>หมายเหตุ</label>
      <input type="text" id="txNote" placeholder="เช่น ค่าข้าวเที่ยง">
    </div>

    <div class="btn-row">
      <button class="btn btn-danger hidden" id="txDeleteBtn" onclick="deleteCurrentTx()">ลบ</button>
      <button class="btn btn-outline" onclick="closeTxSheet()">ยกเลิก</button>
      <button class="btn btn-primary" id="txSaveBtn" onclick="saveTx()">บันทึก</button>
    </div>
  </div>
</div>

<!-- ===== Category Sheet ===== -->
<div class="sheet-overlay hidden" id="catSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="catSheetTitle">เพิ่มหมวดหมู่</h3>
    <div class="field">
      <label>ไอคอน (emoji)</label>
      <input type="text" id="catEmoji" placeholder="🍜" maxlength="4">
    </div>
    <div class="field">
      <label>ชื่อหมวดหมู่</label>
      <input type="text" id="catName" placeholder="เช่น อาหาร">
    </div>
    <div class="field">
      <label>สี</label>
      <input type="color" id="catColor" value="#64748b" style="height:44px; padding:4px;">
    </div>
    <div class="btn-row">
      <button class="btn btn-danger hidden" id="catDeleteBtn" onclick="deleteCurrentCat()">ลบ</button>
      <button class="btn btn-outline" onclick="closeCategorySheet()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveCategory()">บันทึก</button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = 'https://yfojjrvcgmkqvcpbvhdi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ozbTIla8aefRUj9APNMRGQ_Q3Sg1GTl';
const PARSE_RECEIPT_URL = `${SUPABASE_URL}/functions/v1/hyper-function`;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============ STATE ============ */
const CACHE_KEY = 'expense_tracker_cache_v1';
let state = {
  transactions: [],
  categories: [],
  settings: { currency: 'THB', start_of_month: '1' },
};
let currentMonth = new Date(); // ใช้กำหนด เดือน/ปี ที่กำลังดู
let activeTab = 'dashboard';
let categoryChart = null;

let txEditingId = null;   // null = กำลังเพิ่มใหม่
let txType = 'expense';
let txSelectedCategoryId = null;
let txReceiptUrl = null;  // url รูปสลิปที่อัปโหลดแล้ว (ถ้ามี)

let catEditingId = null;
let catEditingType = 'expense';

/* ============ UTIL ============ */
function satangToDisplay(satang){
  return (satang/100).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtMoney(satang, withSign){
  const v = satangToDisplay(Math.abs(satang));
  return (withSign && satang < 0 ? '-' : '') + '฿' + v;
}
function toSatang(bahtStr){
  const n = parseFloat(bahtStr);
  if (isNaN(n)) return 0;
  return Math.round(n * 100);
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function monthKey(date){
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0');
}
function thaiMonthLabel(date){
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  return months[date.getMonth()] + ' ' + (date.getFullYear()+543);
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 6000);
}
function saveCacheToLocal(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadCacheFromLocal(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) state = JSON.parse(raw);
  }catch(e){}
}

/* ============ DATA LOADING (stale-while-revalidate) ============ */
async function init(){
  loadCacheFromLocal();
  renderAll(); // render จาก cache ทันที (ถ้ามี) ให้รู้สึกเร็ว

  document.getElementById('txDate').value = todayStr();

  await syncFromServer();
  renderAll();

  bindEvents();
  registerServiceWorker();
}

async function syncFromServer(){
  try{
    const [catRes, txRes, setRes] = await Promise.all([
      sb.from('categories').select('*').order('created_at'),
      sb.from('transactions').select('*').order('date', {ascending:false}),
      sb.from('settings').select('*'),
    ]);
    if (catRes.error) throw catRes.error;
    if (txRes.error) throw txRes.error;
    if (setRes.error) throw setRes.error;

    state.categories = catRes.data;
    state.transactions = txRes.data;
    const settingsObj = {};
    setRes.data.forEach(s => settingsObj[s.key] = s.value);
    state.settings = settingsObj;

    saveCacheToLocal();
  }catch(err){
    console.error('sync error', err);
    showToast('ซิงก์ข้อมูลไม่สำเร็จ (ใช้ข้อมูลล่าสุดที่มี)');
  }
}

/* ============ TAB NAV ============ */
function bindEvents(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });
  document.getElementById('prevMonth').addEventListener('click', ()=>{
    currentMonth.setMonth(currentMonth.getMonth()-1);
    renderAll();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    currentMonth.setMonth(currentMonth.getMonth()+1);
    renderAll();
  });
  document.getElementById('receiptInput').addEventListener('change', handleReceiptUpload);
  document.getElementById('currencySelect').addEventListener('change', (e)=> updateSetting('currency', e.target.value));
  document.getElementById('startOfMonthSelect').addEventListener('change', (e)=> updateSetting('start_of_month', e.target.value));
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  ['dashboard','transactions','categories','settings'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab);
  });
  renderAll();
}

/* ============ RENDER ============ */
function getMonthTransactions(){
  const mk = monthKey(currentMonth);
  return state.transactions.filter(t => t.date.slice(0,7) === mk);
}

function categoryById(id){

function renderCategoryChart(monthTx){

  });
  const entries = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);

  const ctx = document.getElementById('categoryChart');
  const legend = document.getElementById('catLegend');

  if (entries.length === 0){
    if (categoryChart) { categoryChart.destroy(); categoryChart = null; }
    legend.innerHTML = '<div class="empty-state" style="padding:10px"><div class="emoji">📊</div>ยังไม่มีรายจ่ายเดือนนี้</div>';
    return;
  }

  const labels = entries.map(([id])=> categoryById(id)?.name || 'อื่นๆ');
  const colors = entries.map(([id])=> categoryById(id)?.color || '#64748b');
  const data = entries.map(([,amt])=> amt/100);

  if (categoryChart) categoryChart.destroy();
  categoryChart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor: colors, borderWidth:2, borderColor:'#fff' }] },
    options:{

/* ============ RECEIPT OCR ============ */
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ย่อรูปสลิปให้ ≤ ~100KB โดยยังอ่านตัวหนังสือออก (ด้านยาวไม่ต่ำกว่า 1000px, JPEG quality ไม่ต่ำกว่า 0.5)
const RECEIPT_MAX_BYTES = 100 * 1024;
async function loadBitmap(file){
  if (window.createImageBitmap){
    try{ return await createImageBitmap(file, { imageOrientation: 'from-image' }); }catch(_){}
  }
  return await new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function canvasToJpeg(canvas, quality){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}
async function compressReceipt(file){
  try{
    const bmp = await loadBitmap(file);
    const srcW = bmp.width, srcH = bmp.height;
    const longSide = Math.max(srcW, srcH);
    const dims = [1600, 1400, 1200, 1000].map(d => Math.min(d, longSide));
    const qualities = [0.8, 0.7, 0.6, 0.5];
    let best = null;
    for (const dim of dims){
      const scale = dim / longSide;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(srcW * scale);
      canvas.height = Math.round(srcH * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      for (const q of qualities){
        const blob = await canvasToJpeg(canvas, q);
        if (!blob) continue;
        best = blob;
        if (blob.size <= RECEIPT_MAX_BYTES) return blob;
      }
    }
    return best || file;
  }catch(err){
    console.error('compress failed, using original', err);
    return file;
  }
}

async function handleReceiptUpload(e){
  const file = e.target.files[0];
  if (!file) return;

  const previewUrl = URL.createObjectURL(file);
  document.getElementById('receiptPreview').src = previewUrl;
  document.getElementById('receiptPreview').classList.remove('hidden');
  document.getElementById('receiptUploadText').innerHTML = '<span class="spinner" style="border-color:rgba(15,118,110,.3); border-top-color:var(--primary)"></span> กำลังอ่านสลิป...';

  try{
    // ย่อรูปก่อน (~100KB) แล้วใช้ไฟล์เดียวกันทั้งอ่าน AI และเก็บลง Storage
    const small = await compressReceipt(file);
    const base64 = await blobToBase64(small);
    const smallType = small.type || 'image/jpeg';
    const path = `receipt_${Date.now()}.jpg`;

    const [parseRes, uploadRes] = await Promise.all([
      fetch(PARSE_RECEIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ image_base64: base64, mime_type: smallType }),
      }).then(r=>r.json()),
      sb.storage.from('receipts').upload(path, small, { contentType: smallType }),
    ]);

    if (parseRes.error) throw new Error(parseRes.error);
    if (uploadRes.error) throw uploadRes.error;

    const { data: urlData } = sb.storage.from('receipts').getPublicUrl(path);
    txReceiptUrl = urlData.publicUrl;

    // เติมฟอร์มจากผลลัพธ์ AI ให้ user ตรวจสอบก่อนบันทึก
    if (parseRes.amount > 0){
      document.getElementById('txAmount').value = parseRes.amount.toFixed(2);
    }
    if (parseRes.date){
      document.getElementById('txDate').value = parseRes.date;
    }
    if (parseRes.note === undefined && parseRes.merchant){
      document.getElementById('txNote').value = parseRes.merchant;
    }
    if (parseRes.type){
      setTxType(parseRes.type);
    }
    if (parseRes.category_id && state.categories.find(c=>c.id===parseRes.category_id)){
      txSelectedCategoryId = parseRes.category_id;
      renderTxCatGrid();
    }

    document.getElementById('receiptUploadText').textContent = '📷 เปลี่ยนรูปสลิป';
    document.getElementById('ocrBadge').classList.remove('hidden');
    const confPct = Math.round((parseRes.confidence||0)*100);
    document.getElementById('ocrBadge').textContent = `✓ อ่านจากสลิป (ความมั่นใจ ${confPct}%) — ตรวจสอบก่อนบันทึก`;
  }catch(err){
    console.error(err);
    showToast('อ่านสลิปไม่สำเร็จ: ' + (err.message || JSON.stringify(err)));
    document.getElementById('receiptUploadText').textContent = '📷 ลองอัปโหลดใหม่';
  }
}

/* ============ EXPORT: Excel / PDF พร้อมรูปสลิป ============ */
const EXPORT_FONT = 'TH Sarabun New';
const _scriptCache = {};
function loadScript(src){
  if (_scriptCache[src]) return _scriptCache[src];
  _scriptCache[src] = new Promise((resolve, reject)=>{
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => { delete _scriptCache[src]; reject(new Error('โหลดไลบรารีไม่สำเร็จ (ต้องต่อเน็ต)')); };
    document.head.appendChild(el);
  });
  return _scriptCache[src];
}
function pad2(n){ return String(n).padStart(2,'0'); }
function dateToThai(str){ // 'YYYY-MM-DD' -> 'DD/MM/BBBB' (พ.ศ.)
  const [y,m,d] = String(str).split('-');
  return `${d}/${m}/${parseInt(y,10)+543}`;
}
function escHtml(v){
  return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
let _exportInit = false;
function initExportRange(){
  const f = document.getElementById('exportFrom'), t = document.getElementById('exportTo');
  if (!f.value || !t.value){
    const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
    const last = new Date(y, m+1, 0).getDate();
    f.value = `${y}-${pad2(m+1)}-01`;
    t.value = `${y}-${pad2(m+1)}-${pad2(last)}`;
  }
  if (!_exportInit){
    _exportInit = true;
    f.addEventListener('change', updateExportInfo);
    t.addEventListener('change', updateExportInfo);
  }
  updateExportInfo();
}
function getExportRows(){
  const from = document.getElementById('exportFrom').value;
  const to = document.getElementById('exportTo').value;
  return state.transactions
    .filter(t => (!from || t.date >= from) && (!to || t.date <= to))
    .sort((a,b)=> a.date.localeCompare(b.date) || String(a.created_at||'').localeCompare(String(b.created_at||'')));
}
function updateExportInfo(){
  const rows = getExportRows();
  const withImg = rows.filter(r => r.receipt_url).length;
  document.getElementById('exportInfo').textContent = `${rows.length} รายการ · มีรูปสลิป ${withImg} รูป`;
}
function setExportBusy(on, text){
  ['btnExportXlsx','btnExportPdf','btnExportCsv'].forEach(id => document.getElementById(id).disabled = on);
  const info = document.getElementById('exportInfo');
  if (on) info.textContent = text || 'กำลังทำงาน...';
  else updateExportInfo();
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
async function fetchReceiptImages(rows, onProgress){
  const urls = [...new Set(rows.map(r => r.receipt_url).filter(Boolean))];
  const map = new Map();
  let idx = 0, done = 0, failed = 0;
  async function worker(){
    while (idx < urls.length){
      const u = urls[idx++];
      try{
        const res = await fetch(u);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const bmp = await loadBitmap(blob);
        map.set(u, { blob, w: bmp.width, h: bmp.height, objUrl: URL.createObjectURL(blob) });
      }catch(e){ failed++; console.error('โหลดรูปไม่สำเร็จ', u, e); }
      done++;
      if (onProgress) onProgress(done, urls.length);
    }
  }
  await Promise.all(Array.from({length: Math.min(4, urls.length)}, worker));
  return { map, failed };
}
function exportSummary(rows){
  let inc = 0, exp = 0;
  rows.forEach(t => { if (t.type === 'income') inc += t.amount; else exp += t.amount; });
  return { inc, exp, net: inc - exp };
}

  try{
    await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js');
    imgs = await fetchReceiptImages(rows, (d,n)=> setExportBusy(true, `กำลังโหลดรูปสลิป ${d}/${n}`));
    setExportBusy(true, 'กำลังสร้างไฟล์ Excel...');

    const wb = new ExcelJS.Workbook();
    wb.creator = 'รายรับ-รายจ่าย';
    const ws = wb.addWorksheet('รายการ', { views: [{ state:'frozen', ySplit:1 }] });
    const baseFont = { name: EXPORT_FONT, size: 14 };
    ws.columns = [
      { header:'วันที่', width:13 },
      { header:'ประเภท', width:10 },
      { header:'หมวดหมู่', width:18 },
      { header:'จำนวนเงิน (บาท)', width:16 },
      { header:'หมายเหตุ', width:30 },
      { header:'รูปสลิป', width:22 },
      { header:'ลิงก์รูป', width:12 },
    ];
    const head = ws.getRow(1);
    head.height = 26;
    head.eachCell(c => {
      c.font = { ...baseFont, bold:true, color:{argb:'FFFFFFFF'} };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF0F766E'} };
      c.alignment = { vertical:'middle', horizontal:'center' };
    });

    const BOX_W = 150, BOX_H = 125; // px ของรูปในช่อง
    const pendingImgs = [];
    rows.forEach((t, i) => {
      const cat = categoryById(t.category_id);
      const img = t.receipt_url ? imgs.map.get(t.receipt_url) : null;
      const r = ws.addRow([
        dateToThai(t.date),
        t.type === 'income' ? 'รายรับ' : 'รายจ่าย',
        cat?.name || '',
        t.amount / 100,
        t.note || '',
        '',
        t.receipt_url ? { text:'เปิดรูป', hyperlink: t.receipt_url } : '',
      ]);
      r.height = img ? 100 : 22;
      r.eachCell({ includeEmpty:true }, (c, col) => {
        c.font = { ...baseFont };
        c.alignment = { vertical:'middle', horizontal: col === 4 ? 'right' : (col === 1 || col === 2 ? 'center' : 'left'), wrapText: col === 5 };
        c.border = { bottom:{style:'hair', color:{argb:'FFCBD5E1'}} };
      });
      r.getCell(4).numFmt = '#,##0.00';
      r.getCell(2).font = { ...baseFont, color:{argb: t.type === 'income' ? 'FF15803D' : 'FFDC2626'} };
      if (t.receipt_url) r.getCell(7).font = { ...baseFont, color:{argb:'FF2563EB'}, underline:true };
      if (img){
        const s = Math.min(BOX_W / img.w, BOX_H / img.h);
        const iw = Math.round(img.w * s), ih = Math.round(img.h * s);
        pendingImgs.push({ img, iw, ih, rowIdx: i + 1 });
      }
    });
    // วางรูปหลังสร้างแถวครบ (ต้องแปลง blob -> buffer แบบ async)
    for (const { img, iw, ih, rowIdx } of pendingImgs){
      const buffer = await img.blob.arrayBuffer();
      const ext = (img.blob.type || '').includes('png') ? 'png' : 'jpeg';
      const id = wb.addImage({ buffer, extension: ext });
      ws.addImage(id, { tl:{ col: 5 + ((BOX_W + 9 - iw) / 2) / 159, row: rowIdx + 0.04 }, ext:{ width: iw, height: ih }, editAs:'oneCell' });
    }

    // แถวสรุปรวม
    const sum = exportSummary(rows);
    const first = 2, last = rows.length + 1;
    ws.addRow([]);
    const totals = [
      ['รวมรายรับ', `SUMIF(B${first}:B${last},"รายรับ",D${first}:D${last})`, sum.inc / 100],
      ['รวมรายจ่าย', `SUMIF(B${first}:B${last},"รายจ่าย",D${first}:D${last})`, sum.exp / 100],
    ];
    totals.forEach(([label, formula, result]) => {
      const r = ws.addRow(['', '', label, { formula, result }]);
      r.getCell(3).font = { ...baseFont, bold:true }; r.getCell(3).alignment = { horizontal:'right' };
      r.getCell(4).font = { ...baseFont, bold:true }; r.getCell(4).numFmt = '#,##0.00';
    });
    const netRow = ws.addRow(['', '', 'คงเหลือ', { formula:`D${last+2}-D${last+3}`, result: sum.net / 100 }]);
    netRow.getCell(3).font = { ...baseFont, bold:true }; netRow.getCell(3).alignment = { horizontal:'right' };
    netRow.getCell(4).font = { ...baseFont, bold:true }; netRow.getCell(4).numFmt = '#,##0.00';

    // ชีตสรุปตามหมวดหมู่
    const ws2 = wb.addWorksheet('สรุปตามหมวด');
    ws2.columns = [ {header:'หมวดหมู่', width:24}, {header:'ประเภท', width:12}, {header:'จำนวนรายการ', width:16}, {header:'รวม (บาท)', width:18} ];
    ws2.getRow(1).eachCell(c => {
      c.font = { ...baseFont, bold:true, color:{argb:'FFFFFFFF'} };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF0F766E'} };
      c.alignment = { horizontal:'center' };
    });
    const byCat = {};
    rows.forEach(t => {
      const key = t.type + '|' + (t.category_id || '');
      const cat = categoryById(t.category_id);
      byCat[key] = byCat[key] || { name: cat?.name || '(ไม่ระบุ)', type: t.type, n: 0, sum: 0 };
      byCat[key].n++; byCat[key].sum += t.amount;
    });
    Object.values(byCat).sort((a,b)=> a.type.localeCompare(b.type) || b.sum - a.sum).forEach(c => {
      const r = ws2.addRow([c.name, c.type === 'income' ? 'รายรับ' : 'รายจ่าย', c.n, c.sum / 100]);
      r.eachCell(cell => { cell.font = { ...baseFont }; });
      r.getCell(4).numFmt = '#,##0.00';
    });

    const buf = await wb.xlsx.writeBuffer();
    const from = document.getElementById('exportFrom').value, to = document.getElementById('exportTo').value;
    downloadBlob(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `expense-${from}_to_${to}.xlsx`);
    showToast(imgs.failed ? `Export แล้ว (โหลดรูปไม่ได้ ${imgs.failed} รูป)` : 'Export Excel แล้ว');
  }catch(err){
    console.error(err);
    showToast('Export Excel ไม่สำเร็จ: ' + (err.message || err));
  }finally{
    imgs.map.forEach(v => URL.revokeObjectURL(v.objUrl));
    setExportBusy(false);
  }
}

/* ---------- PDF (เรนเดอร์ทีละหน้าด้วยฟอนต์ TH Sarabun New แล้วใส่ลง PDF) ---------- */
async function exportPDF(){
  const rows = getExportRows();
  if (!rows.length){ showToast('ไม่มีรายการในช่วงวันที่นี้'); return; }
  setExportBusy(true, 'กำลังโหลดตัวสร้างไฟล์...');
  let imgs = { map: new Map(), failed: 0 };
  const stage = document.createElement('div');
  stage.style.cssText = 'position:fixed; left:-10000px; top:0; z-index:-1;';
  document.body.appendChild(stage);
  try{
    await Promise.all([
      loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'),
      loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'),
    ]);
    await Promise.all([ document.fonts.load(`18px "${EXPORT_FONT}"`), document.fonts.load(`bold 18px "${EXPORT_FONT}"`) ]);
    imgs = await fetchReceiptImages(rows, (d,n)=> setExportBusy(true, `กำลังโหลดรูปสลิป ${d}/${n}`));

    const from = document.getElementById('exportFrom').value, to = document.getElementById('exportTo').value;
    const sum = exportSummary(rows);
    const PAGE_W = 794, PAGE_H = 1123, PAD = 40;
    const IMG_ROW_H = 118, TXT_ROW_H = 36, HEAD_H = 34, TITLE_H = 130;

    // แบ่งแถวเป็นหน้า (ประมาณความสูงต่อแถว)
    const pages = [[]]; let used = TITLE_H + HEAD_H, limit = PAGE_H - PAD*2 - 30;
    rows.forEach(t => {
      const hasImg = t.receipt_url && imgs.map.has(t.receipt_url);
      let h = hasImg ? IMG_ROW_H : TXT_ROW_H;
      if (!hasImg && (t.note || '').length > 26) h += 22;
      if (used + h > limit){ pages.push([]); used = HEAD_H; }
      pages[pages.length-1].push(t); used += h;
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

    for (let p = 0; p < pages.length; p++){
      setExportBusy(true, `กำลังสร้างหน้า ${p+1}/${pages.length}`);
      const rowsHtml = pages[p].map(t => {
        const cat = categoryById(t.category_id);
        const img = t.receipt_url ? imgs.map.get(t.receipt_url) : null;
        const color = t.type === 'income' ? '#15803d' : '#dc2626';
        return `<tr style="height:${img ? IMG_ROW_H : TXT_ROW_H}px;">
          <td style="width:88px;">${dateToThai(t.date)}</td>
          <td style="width:150px;">${escHtml(cat?.name || '')}<div style="font-size:14px; color:${color};">${t.type === 'income' ? 'รายรับ' : 'รายจ่าย'}</div></td>
          <td>${escHtml(t.note || '')}</td>
          <td style="width:104px; text-align:right; font-weight:700; color:${color};">${satangToDisplay(t.amount)}</td>
          <td style="width:96px; text-align:center;">${img ? `<img src="${img.objUrl}" style="max-width:88px; max-height:104px;">` : ''}</td>
        </tr>`;
      }).join('');
      const title = p === 0 ? `
        <div style="height:${TITLE_H}px;">
          <div style="font-size:30px; font-weight:700; color:#0f766e;">รายงานรายรับ-รายจ่าย</div>
          <div style="font-size:18px; margin-top:2px;">ช่วงวันที่ ${dateToThai(from)} – ${dateToThai(to)} · ${rows.length} รายการ</div>
          <div style="display:flex; gap:12px; margin-top:10px; font-size:18px;">
            <div style="flex:1; background:#f0fdf4; border-radius:8px; padding:6px 10px;">รายรับ<br><b style="color:#15803d; font-size:22px;">฿${satangToDisplay(sum.inc)}</b></div>
            <div style="flex:1; background:#fef2f2; border-radius:8px; padding:6px 10px;">รายจ่าย<br><b style="color:#dc2626; font-size:22px;">฿${satangToDisplay(sum.exp)}</b></div>
            <div style="flex:1; background:#f1f5f9; border-radius:8px; padding:6px 10px;">คงเหลือ<br><b style="font-size:22px;">${sum.net < 0 ? '-' : ''}฿${satangToDisplay(Math.abs(sum.net))}</b></div>
          </div>
        </div>` : '';
      stage.innerHTML = `
        <div style="width:${PAGE_W}px; height:${PAGE_H}px; box-sizing:border-box; padding:${PAD}px; background:#fff; color:#0f172a; font-family:'${EXPORT_FONT}',sans-serif; font-size:18px; line-height:1.2; position:relative; overflow:hidden;">
          ${title}
          <table style="width:100%; border-collapse:collapse; table-layout:fixed;">
            <thead><tr style="height:${HEAD_H}px; background:#0f766e; color:#fff;">
              <th style="width:88px;">วันที่</th><th style="width:150px;">หมวดหมู่</th><th>หมายเหตุ</th><th style="width:104px; text-align:right;">จำนวนเงิน</th><th style="width:96px;">รูปสลิป</th>
            </tr></thead>
            <tbody style="vertical-align:middle;">${rowsHtml}</tbody>
          </table>
          <div style="position:absolute; bottom:18px; left:0; right:0; text-align:center; font-size:14px; color:#94a3b8;">หน้า ${p+1}/${pages.length}</div>
        </div>`;
      stage.querySelectorAll('td').forEach(td => { td.style.borderBottom = '1px solid #e2e8f0'; td.style.padding = '3px 6px'; });
      stage.querySelectorAll('th').forEach(th => { th.style.padding = '3px 6px'; if (!th.style.textAlign && th.textContent !== 'รูปสลิป') th.style.textAlign = 'left'; });
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      const canvas = await html2canvas(stage.firstElementChild, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false });
      if (p > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, 210, 297);
      canvas.width = canvas.height = 0;
    }

    pdf.save(`expense-${from}_to_${to}.pdf`);
    showToast(imgs.failed ? `Export แล้ว (โหลดรูปไม่ได้ ${imgs.failed} รูป)` : 'Export PDF แล้ว');
  }catch(err){
    console.error(err);
    showToast('Export PDF ไม่สำเร็จ: ' + (err.message || err));
  }finally{
    stage.remove();
    imgs.map.forEach(v => URL.revokeObjectURL(v.objUrl));
    setExportBusy(false);
  }
}

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW register failed', err));
  }
}
